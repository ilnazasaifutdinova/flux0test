apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zammad
  namespace: zammad
spec:
  interval: 5m
  chart:
    spec:
      chart: zammad
      version: "12.0.0"
      sourceRef:
        kind: HelmRepository
        name: zammad
        namespace: flux-system
  values:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: zammad.local
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
    postgresql:
      enabled: true
    elasticsearch:
      enabled: true
